# gitleaks configuration. Extends the default ruleset with allowlist
# entries for known test fixtures so CI doesn't flag them as leaks.
#
# Real secrets (cloud-provider keys, GitHub PATs, JWTs, generic
# high-entropy strings) still trigger findings; only the literal
# fixtures below are suppressed.
#
# When adding a new test that hardcodes a fake-looking token, add it
# here rather than disabling gitleaks — as a `regexes` entry.
#
# Suppress by `regexes` — NEVER by `paths` (cms-platform issue #260). A
# `paths` entry is not a finding filter: gitleaks skips the file ENTIRELY,
# before any rule runs, so a REAL credential pasted into it is never
# reported. This config used to exclude oauth-proxy/test_lambda.py, the two
# e2e/admin-reviews-*.spec.js files and scripts/scrub-secrets.js that way.
# This repo has never tracked any of them (0 commits each), so the entries
# suppressed nothing here — measured on the pinned 8.30.1 over the full
# history, a config carrying ONLY those paths and no regexes reports exactly
# what the bare default ruleset reports (1 finding either way). Recreating
# them in a test tree of the platform's real fixtures made gitleaks skip all
# 29,326 bytes and tripped the canary with "allowlist blind spot" errors.
#
# Narrowing a `paths` entry does not work either: `regexTarget = "secret"`
# is ACCEPTED — it names the allowlist's DEFAULT target, so it narrows
# nothing — and gitleaks SILENTLY IGNORES unknown TOML keys, so a
# `condition = "AND"` is dropped without warning and the path alone
# re-suppresses the whole file. Delete, do not narrow.
#
# The "Allowlist canary" step in cms-platform's
# .github/workflows/secrets-scan.yml enforces this: it plants a detectable
# credential at every allowlisted path and fails if the config cannot see
# it. It only probes paths matching files TRACKED at scan time, though, so
# an entry matching nothing passes vacuously — so they would still pass on
# the day an entry re-armed against an untracked path. (It is not what let
# these survive: the canary only reached this repo with the v0.1.84 bump,
# so for their whole life there was no canary at all.)

[extend]
useDefault = true

[[allowlists]]
description = "CMS platform test fixtures"
regexes = [
  # Belt-and-braces: any ghp_*test*/ghp_*fake* literal anywhere.
  '''ghp_(test|fake)[A-Za-z0-9_]*''',
  # OAuth client placeholder pair used in test_lambda.py.
  '''test_client_(id|secret)''',
]

# skills.lock digests: suppress ONLY a lock ENTRY LINE — a "<bundle>/<skill>"
# key whose value is a bare sha256. gitleaks' generic-api-key rule fires on one
# such line, not because the digest is secret but because the rule wants a
# secret-ish KEYWORD near a high-entropy value and a skill is literally named
# `cms-platform-secrets`. The digest is a hash of public files in a public repo.
#
# This keys on the VALUE'S SHAPE, not the skill name, so a future skill named
# *-secrets / *-token / *-key needs no further edit.
#
# Do NOT "simplify" this into a `paths` entry. A global allowlist `paths` entry
# makes gitleaks skip the file ENTIRELY, before any rule runs — it is a
# whole-file, all-rules blind spot, and `matchCondition`/`regexes` cannot narrow
# it (measured 2026-08-16, gitleaks 8.30.1: adding the path dropped the scanned
# byte count by exactly the size of skills.lock, and a planted AWS key + GitHub
# PAT + Slack token in that file all went unreported). Matching the line shape
# instead keeps every other rule live on the file: those same three planted
# credentials are still reported, and a real 64-hex secret written as
# `api_key = "<64 hex>"` anywhere in the repo is still reported.
[[allowlists]]
description = "skills.lock: <bundle>/<skill> entry lines carrying a bare sha256"
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9._-]+/[A-Za-z0-9._-]+": "[a-f0-9]{64}",?\s*$''']
