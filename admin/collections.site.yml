  # ─────────────────────────────────────────────────────────────────────────────────
  # FOLDER COLLECTIONS: repeating items with automatic ordering via `weight` field.
  # ─────────────────────────────────────────────────────────────────────────────────

  - name: expertise
    label: "Expertise"
    folder: "_expertise"
    create: true
    slug: "{{weight}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { name: title,       label: "Title", widget: string }
      - { name: description, label: "Description", widget: text }
      - { name: weight,      label: "Order", widget: number, hint: "1–6; controls sort order" }

  - name: experience
    label: "Experience"
    folder: "_experience"
    create: true
    slug: "{{weight}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { name: title,       label: "Role", widget: string }
      - { name: org,         label: "Organization", widget: string }
      - { name: period,      label: "Period", widget: string }
      - { name: description, label: "Description", widget: text }
      - { name: weight,      label: "Order", widget: number, hint: "1–5; controls sort order" }

  - name: accomplishments
    label: "Accomplishments"
    folder: "_accomplishments"
    create: true
    slug: "{{weight}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { name: title, label: "Label (bold lead-in)", widget: string }
      - { name: text,  label: "Text", widget: text }
      - { name: weight, label: "Order", widget: number, hint: "1–7; controls sort order" }

  - name: media
    label: "Media Items"
    folder: "_media"
    create: true
    slug: "{{weight}}-{{slug}}"
    editor:
      preview: false
    fields:
      # Five categories in two groups -- the first two are things she wrote,
      # the last three are things she appeared in or that were written about
      # her. DUAL-MAINTAINED across THREE places: this options list, the
      # media_authored_cats/media_coverage_cats lists in _layouts/home.html
      # (which also decide the group each category renders under), and the
      # `{% case page.category %}` default-label map in _layouts/media.html.
      # A value present in one but not the others silently drops items,
      # mislabels a picker option, or mislabels a per-item page's button,
      # with no build error. See docs/CONTENT-MODEL.md.
      - { name: category, label: "Category", widget: select, options: ["Articles & Commentary", "Briefs, Testimony & Reports", "Talks & Panels", "Podcasts & Interviews", "Press Coverage"], hint: "The first two (Articles & Commentary; Briefs, Testimony & Reports) are things she wrote. The last three (Talks & Panels; Podcasts & Interviews; Press Coverage) are things she appeared in, or that someone else wrote about her." }
      - { name: title,    label: "Title", widget: string }
      - { name: source,   label: "Source", widget: string }
      # NOT `url`. A front-matter key named `url` is unreachable from Liquid:
      # Jekyll's DocumentDrop defines `url` (the document's OWN address) and it
      # shadows the front-matter value, so {{ item.url }} renders /media/<slug>/
      # instead of the article link. See docs/CONTENT-MODEL.md.
      - { name: article_url, label: "Article URL", widget: string, pattern: ["^https?://.*", "Must be a valid http(s) URL"] }
      - { name: link_label, label: "Link Button Label", widget: string, required: false, hint: "Optional. Leave blank and a sensible label is picked automatically from Category (e.g. \"Read the brief\" for Policy & Advocacy, \"Listen to the episode\" for Podcasts & Interviews). Set this only to override that default for an unusual item." }
      - { name: pdf,      label: "PDF Copy", widget: file, required: false, pattern: ['\.pdf$', 'Must be a PDF file (.pdf)'], hint: "Optional. Upload a PDF of the piece (an offprint, or a copy of a paywalled article). Must be a .pdf file. It appears as a download link on the item's own page, next to the Article URL." }
      - { name: pdf_label, label: "PDF Button Label", widget: string, required: false, hint: "Optional. Leave blank to use the default \"Download PDF\". Set this only to override that default for an unusual item." }
      - { name: weight,   label: "Order within category", widget: number }

  - name: education
    label: "Education"
    folder: "_education"
    create: true
    slug: "{{weight}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { name: degree,  label: "Degree", widget: string }
      - { name: field,   label: "Field", widget: string }
      - { name: school,  label: "School", widget: string }
      - { name: weight,  label: "Order", widget: number, hint: "1–3; controls sort order" }

  # Jodi's 2026-08-30 feedback item 3: Upcoming Events. Departs from every
  # sibling folder collection above in one way on purpose -- there is no
  # `weight` field here. Order is `start_date` (an ISO YYYY-MM-DD string),
  # because "upcoming" is inherently chronological, and letting the date
  # itself decide the order frees the owner from renumbering the whole list
  # every time she inserts an event between two existing ones. See
  # docs/CONTENT-MODEL.md.
  #
  # `event_url`, NOT `url` -- same DocumentDrop-shadow trap `_media` already
  # hit (see the `article_url`/`url` comment on the media collection below,
  # and docs/CONTENT-MODEL.md): a front-matter `url:` key on a collection
  # document is unreachable from Liquid, so this field is named `event_url`.
  #
  # The `start_date` `pattern:` below MUST stay single-quoted YAML --
  # `'^\d{4}-\d{2}-\d{2}$'`. A double-quoted `"\d"` is a YAML parse error
  # (not merely a different regex), same trap the `pdf` field's pattern
  # below already documents.
  - name: events
    label: "Upcoming Events"
    folder: "_events"
    create: true
    slug: "{{fields.start_date}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { name: title,        label: "Event name", widget: string }
      - { name: org,          label: "Host organization", widget: string }
      - { name: start_date,   label: "Start date (sets the order)", widget: string, pattern: ['^\d{4}-\d{2}-\d{2}$', 'Use YYYY-MM-DD, e.g. 2026-10-20'], hint: "Year-month-day, e.g. 2026-10-20. This is what orders the list -- earliest first. It is NOT what visitors see; that is the next field." }
      - { name: date_display, label: "Dates (as shown on the page)", widget: string, hint: "Written however you want it to read, e.g. \"October 20 - 21, 2026\"." }
      - { name: location,     label: "Location", widget: string, hint: "City and state, e.g. \"Kansas City, MO\". The venue lives on the event's own site." }
      - { name: session,      label: "Your session (optional)", widget: text, required: false, hint: "Optional. The panel or talk you are on, with its own date and time, e.g. \"Panel - Federal and State AI Policies, October 1 at 4:00 PM\". Leave blank if you are attending rather than speaking." }
      - { name: event_url,    label: "Event website", widget: string, required: false, pattern: ["^https?://.*", "Must be a valid http(s) URL"] }

  # ─────────────────────────────────────────────────────────────────────────────────
  # FILE COLLECTIONS: singleton sections (one entry each).
  # ─────────────────────────────────────────────────────────────────────────────────

  - name: site_header
    label: "Header / Hero"
    delete: false
    editor:
      preview: false
    files:
      - name: header
        label: "Header (Name & Tagline)"
        file: "_data/header.yml"
        fields:
          - { name: name,    label: "Name", widget: string }
          - { name: tagline, label: "Tagline", widget: string }

  - name: site_about
    label: "About"
    delete: false
    editor:
      preview: false
    files:
      - name: about
        label: "About Section"
        file: "_data/about.yml"
        fields:
          - { name: photo,         label: "Profile Photo", widget: image, required: false, media_library: { config: { multiple: false } } }
          - { name: intro_heading, label: "Intro Heading", widget: string }
          - { name: lead, label: "Opening line (shown above the nav buttons)", widget: text, hint: "One sentence. This is the only body copy above the fold on a laptop -- everything you add here pushes the nav buttons down the page. The longer bio below the buttons is the next field." }
          - { name: bio,           label: "Bio Paragraphs", widget: list, summary: "{{fields.paragraph | truncate(60)}}", field: { name: paragraph, label: "Paragraph", widget: text } }
          - name: nav
            label: "In-Page Nav Links"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "Label", widget: string }
              # issue #196: `anchor` used to be a free-text string, so a typo
              # (e.g. "presss" instead of "media") saved silently -- the
              # pill's href changed the URL hash and nothing else happened,
              # with no error anywhere to explain why. A `select` over the
              # real destinations makes a bad anchor impossible to save.
              #
              # Options are the six sections in _layouts/home.html this nav
              # can actually jump to. `about` is deliberately EXCLUDED: this
              # nav list renders *inside* the About card, so a pill pointing
              # at its own container isn't a meaningful destination.
              #
              # DUAL-MAINTAINED with `_layouts/home.html` -- exactly like
              # `media_by_category` there vs. the media `category` select
              # `options:` above (see docs/CONTENT-MODEL.md): adding,
              # removing, or renaming a `<section id="...">` in the layout
              # means editing this options list too, or the new/renamed
              # section becomes unreachable from the nav picker with no
              # build error. `scripts/verify-build-artifacts.rb` now
              # cross-checks this options list against the built page's
              # actual `<section id="...">` set (see its "admin seam <->
              # layout section ids stay in step" group), so the two can no
              # longer drift silently -- a mismatch fails the build instead
              # of shipping a picker option nobody can jump to (or a real
              # section the picker can't reach).
              - { name: anchor, label: "Anchor (destination section)", widget: select, options: ["events", "expertise", "experience", "accomplishments", "media", "education", "contact"], hint: "Which section this pill jumps to when clicked. This is NOT the same as Label above -- Label is the visible button text; changing Label alone will not change where the pill goes." }

  - name: site_contact
    label: "Contact"
    delete: false
    editor:
      preview: false
    files:
      - name: contact
        label: "Contact Section"
        file: "_data/contact.yml"
        fields:
          - { name: heading, label: "Heading", widget: string }
          - { name: intro,   label: "Intro", widget: text }
          - name: links
            label: "Contact Links"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "Label", widget: string }
              - { name: url,   label: "URL", widget: string, pattern: ["^(https?:|mailto:).*", "http(s) or mailto URL"] }
              - { name: icon,  label: "Icon", widget: select, options: [globe, linkedin, email], default: globe }

  - name: site_settings
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: settings
        label: "Settings & Gating"
        file: "_data/settings.yml"
        fields:
          - { name: site_live, label: "Site Live (controls gating)", widget: boolean, hint: "When false, only shows 'coming soon'; when true, shows full bio." }
          - name: coming_soon
            label: "Coming Soon (shown when site_live = false)"
            widget: object
            fields:
              - { name: tagline,   label: "Coming Soon Tagline", widget: string }
              - { name: copyright, label: "Copyright", widget: string }
          - name: footer
            label: "Footer (shown when site_live = true)"
            widget: object
            fields:
              - { name: copyright, label: "Copyright", widget: string }
          - { label: "Back to Top Button Label", name: "back_to_top_label", widget: "string", hint: "Accessible label for the floating back-to-top button (screen readers only; it's an icon)." }
          - name: section_headings
            label: "Section Headings"
            widget: object
            fields:
              - { name: expertise_heading,       label: "Expertise Heading", widget: string }
              - { name: experience_heading,      label: "Experience Heading", widget: string }
              - { name: accomplishments_heading, label: "Accomplishments Heading", widget: string }
              - { name: media_heading,           label: "Media Heading", widget: string }
              - { name: education_heading,       label: "Education Heading", widget: string }
