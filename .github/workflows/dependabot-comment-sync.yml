# Thin caller — copied into a site repo as
# `.github/workflows/dependabot-comment-sync.yml`. It USED to own the
# `pull_request_target` + `push` + `workflow_dispatch` triggers, the `paths:`
# filter and the run-name, delegating the comment-sync logic to the platform's
# reusable workflow (the sync script lives in the platform repo, never here).
#
# ── DISARMED — DO NOT RE-ARM ────────────────────────────────────────────────
#
# The account has eliminated the trailing `# vX.Y.Z (YYYY-MM-DD)` comment on
# SHA-pinned actions, and cms-platform#293 RETIRES the upstream reusable this
# caller invokes. The `uses:` below pins `@v0.1.89` — an IMMUTABLE tag — so
# deleting that reusable on the platform's `main` does NOT disarm this caller.
# Only removing the triggers does.
#
# Why the FILE stays: `platform-pin-consistency` asserts this repo's workflow
# BASENAME SET equals the canonical set at platform.lock's `platform_ref`, and
# at v0.1.89 the platform template still dictates this caller. Deleting it here
# first reads as `workflow-set: MISSING (platform-dictated)`, not as cleanup
# (measured: run 32373353577). The deletion belongs in the SAME commit that
# bumps `platform_ref` to the first release whose template lacks it.
#
# Why the TRIGGERS go: `scripts/sync-action-pin-comments.sh` does not merely
# REFRESH a pin comment, it GROWS one. Its `USES_RE` captures the trailing
# comment as an OPTIONAL group (`(#.*)?`) while `build_new_line()` emits one
# UNCONDITIONALLY with a two-space default gap — so a bare
# `uses: owner/repo@<40-hex>` line comes back carrying a comment. Today that
# regex has no target in this repo (all 32 `uses:` are `@v0.1.89` cms-platform
# tag pins; `USES_RE` matches only a 40-hex SHA), but it RE-ARMS the instant any
# bare SHA-pinned `uses:` lands under `.github/workflows/` — i.e. the first
# third-party action this site adopts. Restoring `pull_request_target:` or
# `push:` here therefore re-arms a reverter for a decision already made.
#
# `workflow_dispatch` is the residue GHA requires (`on:` cannot be empty) and is
# inert: the reusable's FIRST step early-exits 0 on a manual dispatch ("Manual
# dispatch — comment-sync is dependabot-only; nothing to do"), before the token
# mint and before any file mutation. Only a `pull_request_target` event whose PR
# author is `dependabot[bot]` reaches the mutating path, and that trigger is now
# gone.
#
# The `pull_request_target` security posture documented here previously is moot
# while no such trigger exists. If this file is ever revived, re-derive it from
# the platform reusable's own header rather than from this comment.
#
# The dropped `push: branches: ['**']` trigger existed only to suppress GHA's
# phantom `event=push`/`conclusion=failure`/zero-jobs rows, a pattern the
# platform template documents for a `pull_request_target` workflow. That trigger
# is gone too, so the phantom pattern has no event context left to attach to.
name: Dependabot comment sync
run-name: 'disarmed no-op — manual dispatch by @${{ github.actor }}'

on:
  # MANUAL ONLY, and a no-op even then — see the DISARMED note above.
  # There is deliberately NO `pull_request_target:` and NO `push:` trigger.
  # Do not add one.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/dependabot-comment-sync.yml@v0.1.89
    with:
      # Pin to the SAME ref as the `uses:` pin above so the script matches.
      platform_ref: v0.1.89
    secrets:
      # Fine-grained PAT with `workflows: write` so the follow-up commit can
      # push the refreshed workflow files. Drop this line if the site hasn't
      # configured the PAT — the reusable then skips cleanly with a notice.
      workflow_sha_comment_pat: ${{ secrets.CMS_PLATFORM_PAT }}
      # Fallback when no PAT is configured: a GitHub App (Contents R/W, Pull
      # requests R/W, Workflows R/W). Its App ID is NOT passed here — the
      # reusable reads it from this repo's `vars.CMS_AUTOMATION_APP_ID`
      # variable — so only the private key crosses the boundary. With neither
      # credential the reusable still skips cleanly with a notice naming both.
      app_private_key: ${{ secrets.CMS_AUTOMATION_APP_PRIVATE_KEY }}
