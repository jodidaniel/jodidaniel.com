# Thin caller — copied into a site repo as `.github/workflows/deploy-production.yml`.
# It owns the trigger + paths-ignore; the build/deploy logic lives in the
# platform's reusable workflow. Pin `@vX.Y.Z` to a cms-platform release;
# `platform-bump.yml` opens the bump PR — Dependabot's github-actions
# ecosystem ignores every cms-platform reference (cms-platform#244).
name: Deploy to Production
run-name: >-
  ${{ github.event_name == 'push'
        && format('push — {0} @{1}', github.ref_name, github.actor)
   || format('manual — @{0}', github.actor) }}

on:
  push:
    branches: [main]
    # Customize per site. Skip pushes that can't change what's served from S3
    # (docs, infra-as-code, tests, dev tooling). Keep this workflow file itself
    # OUT of the list so caller-only changes still validate via a real run.
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'e2e/**'
      - 'tests/**'
      - 'infrastructure/**'
      - 'oauth-proxy/**'
      - 'scripts/**'
  # Manual force-deploy (workflow_dispatch ignores paths-ignore).
  workflow_dispatch:

# Reusable workflows are capped by the caller's token permissions — grant here
# what deploy-production.yml declares it needs.
permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  deploy:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/deploy-production.yml@v0.1.101
    with:
      apex_domain: jodidaniel.com
      prod_bucket: jodidaniel-com-production
      # Private S3 bucket of archived media PDFs. The deploy copies out ONLY
      # `_media` entries carrying `pdf_public: true`; everything else stays in
      # the bucket. See docs/CONTENT-MODEL.md, "Archived PDFs".
      media_archive_bucket: jodidaniel-com-media-archive
      # REQUIRED whenever media_archive_bucket is set: the archive step fetches
      # the publish script from the platform at this ref, and the reusable's
      # own default is `main` -- unpinned. MUST equal the `uses:@` pin above;
      # platform-bump rewrites both, and platform-pin-consistency fails the
      # build if they disagree or if this key is missing.
      platform_ref: v0.1.101
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PRODUCTION_CLOUDFRONT_ID: ${{ secrets.PRODUCTION_CLOUDFRONT_ID }}
