# Thin caller — copied into a site repo as
# `.github/workflows/cms-publish-loop-prod.yml`. Owns the push /
# workflow_dispatch triggers + run-name; delegates the prod-mutation
# playground loop to the platform's reusable workflow. The e2e harness +
# the cms-recursion-gate / await-prod-deploy / post-failure-comment
# composites all live in the platform repo. Keep `platform_ref` equal to
# the `@vX.Y.Z` pin on the `uses:` line.
#
# Site identity (CMS_PROD_URL / CMS_APEX) + the PROD_PLAYGROUND_MODE
# sunset gate are read from THIS repo's VARS by the reusable workflow.
name: CMS Publish Loop — Prod Mutation Playground
run-name: >-
  ${{ github.event_name == 'push'
        && format('push — {0} @{1}', github.ref_name, github.actor)
   || format('manual — @{0}', github.actor) }}

# OPTED OUT of triggers (cms-platform#1102 / #1068): this single-page site has
# `cms.base_collections: []`, so the loop's specs self-skip and, since
# cms-platform#1102, a loop that executed zero tests FAILS ("Loop published
# nothing"). docs/CI-INVARIANTS.md in cms-platform lists a loop that drives this
# site's own collections as the open part of #1068. Until it exists, the
# schedule/push triggers are removed and only workflow_dispatch remains.
# Restore the triggers from cms-platform's examples/site caller with that loop.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  prod-loop:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-publish-loop-prod.yml@89a1d9af7a6c1ff593e091851e14c1079a7e3dfc
    with:
      # Pin to the SAME ref as the `uses:` pin above so the harness matches.
      platform_ref: 89a1d9af7a6c1ff593e091851e14c1079a7e3dfc
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
