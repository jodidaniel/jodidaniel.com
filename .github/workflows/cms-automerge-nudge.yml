# Thin caller — copied into a site repo as
# `.github/workflows/cms-automerge-nudge.yml`. Owns the schedule /
# workflow_dispatch triggers + run-name + concurrency lane; delegates the
# stuck-PR recovery to the platform's reusable workflow.
#
# Re-enables auto-merge every 5 minutes on any open CMS canary PR whose
# required checks are all green but whose mergeStateStatus is still
# BLOCKED (issue #1815 Blocker 1 — see the reusable's header for the
# full #1812 differential).
#
# This repo has NO `.github/rulesets/main.json` and NO `e2e/` directory (no
# local lint-lock) — those were adamdaniel.ai artifacts this comment used to
# describe by mistake.
#
# WHAT `required_contexts` IS, and it is BOTH things at once. It is the
# reusable's safety gate — every listed context must be present AND green on
# the PR's head sha, and a context that never reports here (the reusable's
# `headIsTrulyGreen` "missing on head sha" branch) permanently BLOCKS recovery
# for that PR rather than being ignored. It is ALSO what branch protection
# will enforce at the merge itself, so the two have to agree: the reusable
# calls `pulls.merge()` once its own gate passes, and the ruleset answers 405
# if the real required set is not satisfied. Deriving the list from anything
# other than this repo's live ruleset therefore breaks it in one direction or
# the other.
#
# TWO CLAIMS THIS COMMENT USED TO MAKE WERE WRONG. Both were load-bearing —
# they were the stated reason the list held a single entry — and both were
# measured false on 2026-08-20. They are recorded here rather than deleted,
# because a stale comment that merely disappears gets re-derived.
#
#   1. "The live `main` ruleset here requires ZERO status checks." It requires
#      SIX. `GET /repos/jodidaniel/jodidaniel.com/rulesets` -> ruleset `main`,
#      id 17032014: editorial / validate-content, scan / scan, parity / parity,
#      preview-media / preview-media, e2e / e2e,
#      visual-regression / approve-regression. `cms-feature-branches` (id
#      17032043) is a second, separate ruleset that gates the feature-branch
#      refs and requires a bare `validate-content`; it does not target main.
#
#   2. "`e2e / e2e` reports under a DIFFERENT name on docs-only PRs
#      (`E2E (docs-only stub) / e2e`)." It does not. A check-run context from a
#      reusable call is `<caller job id> / <reusable job id>` — the workflow's
#      own `name:` never enters it. `e2e-stub.yml`'s job id is `e2e` and
#      `e2e-required-stub.yml`'s job id is `e2e`, so the stub reports exactly
#      `e2e / e2e`, the same context the heavy lane reports. Observed directly
#      on adamdaniel.ai#3223, a docs-only PR where the heavy lane was skipped by
#      `paths-ignore` and the stub supplied `e2e / e2e` -> success. It is also
#      true by construction: `e2e / e2e` is REQUIRED on main, so if the stub
#      reported under another name every docs-only PR would hang forever on a
#      context nothing ever supplies. They do not.
#
# So the single-entry list was not a considered narrowing, and excluding
# `e2e / e2e` protected against nothing. See the block above `required_contexts`
# for what the list is now and how it was derived.
#
# In practice this whole nudge is dormant here: `cms.base_collections: []`
# hides the `e2e`/`posts` collections from `/admin`, so the host-loop and
# prod-loop canary specs self-skip (cms-platform's
# e2e/cms-publish-loop.spec.js `hasE2ECanaries` guard) and this repo has
# never produced an `automated-test`-labeled PR. Kept for parity with the
# platform consumer shape in case that changes.
# Keep `@vX.Y.Z` on the `uses:` line pinned to a released platform tag.
name: CMS auto-merge nudge
run-name: >-
  ${{ github.event_name == 'schedule'
        && format('scheduled — {0}', github.event.schedule)
   || format('manual — @{0}', github.actor) }}

on:
  schedule:
    # Every 5 minutes — well under the 6h sweep threshold so a stuck PR
    # is recovered long before it would be closed. Cron load is ~288
    # runs/day, each <1 min, one GraphQL query + 0-N tiny mutations.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Single global lane — only one nudge pass at a time. cancel-in-progress
  # is fine here: if a new pass starts mid-flight, the cancelled pass'
  # work is recovered by the next pass (the mutation is idempotent and
  # the next pass re-queries fresh state).
  group: cms-automerge-nudge
  cancel-in-progress: true

jobs:
  nudge:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-automerge-nudge.yml@v0.1.92
    with:
      # NOT branch-protection contexts (this repo's main ruleset requires
      # none) — the one check-run name guaranteed to report, correctly
      # named, on every content PR. See the header comment above for why
      # the rest of the old list was dropped.
      # Every context this repo's `main` ruleset requires. Six were verified
      # 2026-08-20 against `GET /repos/jodidaniel/jodidaniel.com/rulesets`
      # (ruleset `main`, id 17032014); `prerelease-guard / prerelease-guard` is
      # the seventh, added to `consumer-main` by cms-platform#309 and converged
      # onto this repo by `repo-settings-apply.yml`. It is listed here in the
      # same PR as the v0.1.92 bump because `platform-bump` moves pins and seeds
      # new callers but never rewrites an EXISTING caller's inputs — so a
      # platform-side change to this list only reaches a consumer by hand.
      # This list is the nudge's ENTIRE notion of
      # "green": the reusable builds `REQUIRED` from it and gates on
      # `[...REQUIRED].every(GREEN)` before calling `pulls.merge()`.
      #
      # It listed only `editorial / validate-content` from the day it was seeded
      # until now — six platform bumps touched this file and none revisited the
      # value. With one entry the nudge would have called `pulls.merge()` as soon
      # as that single context went green, while `scan`, `parity`,
      # `preview-media`, `e2e` and `visual-regression` were still pending. The
      # ruleset would have rejected the call, so the symptom was a failing merge
      # attempt rather than an unsafe merge — but a guard that asks for a merge
      # it has not established is safe only by accident, and only while the
      # ruleset holds.
      #
      # It has never fired because this site is gated (`_data/settings.yml`
      # `site_live: false`), so there is no editorial traffic and no CMS canary
      # PR for the nudge to act on. That changes at go-live (#26). Fixed before
      # then rather than after.
      #
      # The template's caution is about the opposite error — a WRONG entry makes
      # the nudge wait forever for a context no run reports. A SHORT list is the
      # inverse failure and the template does not warn about it.
      required_contexts: |
        editorial / validate-content
        scan / scan
        parity / parity
        preview-media / preview-media
        e2e / e2e
        visual-regression / approve-regression
        prerelease-guard / prerelease-guard
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
