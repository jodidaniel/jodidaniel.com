name: CMS Editorial Workflow
run-name: "${{ format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}"
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  editorial:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-editorial-workflow.yml@a5fc89114f8e7d4d81072dc873d68ac2cf6fca8a
    with:
      # Pin to the SAME ref as the `uses:` pin above so the module matches.
      platform_ref: a5fc89114f8e7d4d81072dc873d68ac2cf6fca8a
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
