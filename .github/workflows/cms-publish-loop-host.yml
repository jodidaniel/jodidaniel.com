# Thin caller — copied into a site repo as
# `.github/workflows/cms-publish-loop-host.yml`. Owns the schedule / push
# triggers + run-name; delegates the host-repo canary publish loop to the
# platform's reusable workflow. The e2e harness + the cms-recursion-gate /
# await-prod-deploy / post-failure-comment composites all live in the
# platform repo. Keep `platform_ref` equal to the `@vX.Y.Z` pin on the
# `uses:` line.
#
# Site identity (CMS_PROD_URL / CMS_APEX) is read from THIS repo's VARS by
# the reusable workflow.
name: CMS Publish Loop — Host Repo (canary collection)
run-name: >-
  ${{ github.event_name == 'schedule'
        && format('scheduled — {0}', github.event.schedule)
   || github.event_name == 'push'
        && format('push — {0} @{1}', github.ref_name, github.actor)
   || format('manual — @{0}', github.actor) }}

# OPTED OUT of triggers (cms-platform#1102 / #1068): this single-page site has
# `cms.base_collections: []`, so the loop's specs self-skip and, since
# cms-platform#1102, a loop that executed zero tests FAILS ("Loop published
# nothing"). docs/CI-INVARIANTS.md in cms-platform lists a loop that drives this
# site's own collections as the open part of #1068. Until it exists, the
# schedule/push triggers are removed and only workflow_dispatch remains.
# Restore the triggers from cms-platform's examples/site caller with that loop.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  host-loop:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/cms-publish-loop-host.yml@c120db5cdd40181b50a2f029874546cc50e90733
    with:
      # Pin to the SAME ref as the `uses:` pin above so the harness matches.
      platform_ref: c120db5cdd40181b50a2f029874546cc50e90733
    secrets:
      CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
