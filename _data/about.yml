photo: "/assets/images/uploads/jodi-daniel.jpg"
# Jodi's 2026-08-30 feedback, item 1 ("too lawyery/conservative"): the heading
# and lead now open with the concrete claim rather than the credential stack.
# Every string here stays /admin-editable, so any of it can be dialled back
# from the About editor without a code change.
intro_heading: "She helped write the rules for digital health."
# `lead` (feedback item 2) is the short blurb that renders ABOVE the nav pills
# so both land in the first viewport; `bio` renders BELOW them. Keep this to
# roughly one sentence — it is the only body copy above the fold, and every
# line added here pushes the nav down. See docs/CONTENT-MODEL.md.
lead: "Now she helps the people building AI and digital health figure out what those rules mean for them."
bio:
  # issue #197: **bold** here renders through markdownify (see _layouts/home.html)
  # as <strong>, styled to match the mockup's `.highlight` accent color/weight
  # (see .intro-text strong in jodidaniel.css). The owner can bold any future
  # phrase from /admin in plain Markdown — no HTML hand-writing required.
  - "Jodi is a partner at **Wilson Sonsini** in Washington, DC. She advises health systems, digital health and AI companies, and the investors backing them — usually on the products the rulebook did not anticipate."
  - "She spent **15 years as a lawyer and senior policymaker at the U.S. Department of Health and Human Services**: first as the department's first senior counsel for health IT, then as **founding director of the Office of Policy at ONC**. She was a key drafter of the original **HIPAA Privacy Rule**."
  - "She has been doing this for **more than 30 years** — as **one of the first digital health lawyers**, since before the field had a name. She also teaches at **Yale School of Medicine**."
nav:
  # Feedback item 3 added the Events section; "events" must also exist in the
  # `anchor` select options in admin/collections.site.yml (dual-maintained with
  # the <section id="..."> set in _layouts/home.html — see docs/CONTENT-MODEL.md).
  - { label: "Events",          anchor: "events" }
  - { label: "Expertise",       anchor: "expertise" }
  - { label: "Experience",      anchor: "experience" }
  - { label: "Accomplishments", anchor: "accomplishments" }
  # label and section_headings.media_heading are separate strings by design (a
  # nav label may be shorter than a headline) but must name the SAME thing —
  # "Media" described a category that no longer exists now that the section is
  # split into what she wrote and what was written about her. Verifier-checked
  # against settings.section_headings.media_heading in scripts/verify-build-artifacts.rb.
  - { label: "Writing, Talks & Press", anchor: "media" }
  - { label: "Education",       anchor: "education" }
  - { label: "Contact",         anchor: "contact" }
